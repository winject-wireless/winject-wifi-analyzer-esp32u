[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "winject-wifi-analyzer"
version = "0.1.0"
description = "Host tools for the Winject ESP32U Ethernet WiFi analyzer"
requires-python = ">=3.10"

[project.scripts]
winject-wifi-analyzer = "winject_wifi_analyzer.cli:main"

[tool.setuptools]
package-dir = {"" = "host"}

[tool.setuptools.packages.find]
where = ["host"]
